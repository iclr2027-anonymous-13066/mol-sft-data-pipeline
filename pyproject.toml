[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molkit"
version = "0.1.0"
description = "Data-generation pipeline for tool-using molecular generation SFT"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "rdkit>=2022.09.1",
    "numpy>=1.24",
    "pandas>=1.5",
    "pyarrow>=12.0",
    "scipy>=1.10",
    "orjson>=3.9",
    "pydantic>=2.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "openai>=1.30",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["molkit*"]
